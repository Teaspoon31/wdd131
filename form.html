<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Product Review Form">
    <title>Product Review Form</title>
    <link rel="stylesheet" href="css/form.css">
</head>
<body>

<header>
    <h1>Product Review Form</h1>
</header>

<main>
    <form method="get" action="review.html">

        <!-- Product Name -->
        <div class="form-group">
            <label for="productName">
                Product Name <span class="required">*</span>
            </label>

            <select id="productName" name="productName" required>
                <option value="" selected disabled>
                    Select a Product ...
                </option>
            </select>
        </div>

        <!-- Rating -->
        <fieldset class="form-group">
            <legend>
                Overall Rating <span class="required">*</span>
            </legend>

            <label>
                <input type="radio" name="rating" value="1" required>
                ☆
            </label>

            <label>
                <input type="radio" name="rating" value="2">
                ☆☆
            </label>

            <label>
                <input type="radio" name="rating" value="3">
                ☆☆☆
            </label>

            <label>
                <input type="radio" name="rating" value="4">
                ☆☆☆☆
            </label>

            <label>
                <input type="radio" name="rating" value="5">
                ☆☆☆☆☆
            </label>
        </fieldset>

        <!-- Installation Date -->
        <div class="form-group">
            <label for="installDate">
                Date of Installation <span class="required">*</span>
            </label>

            <input
                type="date"
                id="installDate"
                name="installDate"
                required>
        </div>

        <!-- Features -->
        <fieldset class="form-group">
            <legend>Useful Features</legend>

            <label>
                <input type="checkbox"
                    id="durability"
                    name="features"
                    value="Durability">
                Durability
            </label>

            <label>
                <input type="checkbox"
                    id="performance"
                    name="features"
                    value="Performance">
                Performance
            </label>

            <label>
                <input type="checkbox"
                    id="design"
                    name="features"
                    value="Design">
                Design
            </label>

            <label>
                <input type="checkbox"
                    id="easeOfUse"
                    name="features"
                    value="Ease of Use">
                Ease of Use
            </label>
        </fieldset>

        <!-- Review -->
        <div class="form-group">
            <label for="review">
                Written Review
            </label>

            <textarea
                id="review"
                name="review"
                rows="5"></textarea>
        </div>

        <!-- User Name -->
        <div class="form-group">
            <label for="username">
                User Name
            </label>

            <input
                type="text"
                id="username"
                name="username">
        </div>

        <!-- Submit -->
        <div class="form-group">
            <input type="submit" value="Submit Review">
        </div>

    </form>
</main>

<footer>
    <p>&copy; 2026 | Joe Boat | Ghana</p>
    <p id="lastModified"></p>
</footer>

<script src="js/products.js"></script>

<script>
document.getElementById("lastModified").textContent =
`Last Modified: ${document.lastModified}`;
</script>

</body>
</html>
