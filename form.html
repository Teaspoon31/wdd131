```html
<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Product Review Form</title>

    <meta name="description"
        content="Submit a product review by selecting a product, rating it, identifying useful features, and providing optional feedback.">

    <meta name="author" content="Joe Boat">

    <link rel="stylesheet" href="styles/form.css">

    <script src="scripts/products.js" defer></script>
    <script src="scripts/main.js" defer></script>
</head>

<body>

<header>
    <h1>Product Review Form</h1>
</header>

<main>
    <form method="get" action="review.html">

        <div class="form-group">
            <label for="productName">
                Product Name *
            </label>

            <select id="productName" name="productName" required>
                <option value="" disabled selected>
                    Select a Product ...
                </option>
            </select>
        </div>

        <fieldset>
            <legend>Overall Rating *</legend>

            <input type="radio" id="rating1" name="rating" value="1" required>
            <label for="rating1">☆</label>

            <input type="radio" id="rating2" name="rating" value="2" required>
            <label for="rating2">☆☆</label>

            <input type="radio" id="rating3" name="rating" value="3" required>
            <label for="rating3">☆☆☆</label>

            <input type="radio" id="rating4" name="rating" value="4" required>
            <label for="rating4">☆☆☆☆</label>

            <input type="radio" id="rating5" name="rating" value="5" required>
            <label for="rating5">☆☆☆☆☆</label>
        </fieldset>

        <div class="form-group">
            <label for="installDate">
                Date of Installation *
            </label>

            <input
                type="date"
                id="installDate"
                name="installDate"
                required>
        </div>

        <fieldset>
            <legend>Useful Features</legend>

            <input type="checkbox" id="durability" name="features" value="Durability">
            <label for="durability">Durability</label><br>

            <input type="checkbox" id="performance" name="features" value="Performance">
            <label for="performance">Performance</label><br>

            <input type="checkbox" id="design" name="features" value="Design">
            <label for="design">Design</label><br>

            <input type="checkbox" id="easeOfUse" name="features" value="Ease of Use">
            <label for="easeOfUse">Ease of Use</label>
        </fieldset>

        <div class="form-group">
            <label for="review">
                Written Review
            </label>

            <textarea
                id="review"
                name="review"
                rows="5"></textarea>
        </div>

        <div class="form-group">
            <label for="username">
                User Name
            </label>

            <input
                type="text"
                id="username"
                name="username">
        </div>

        <div class="form-group">
            <input type="submit" value="Submit Review">
        </div>

    </form>
</main>

<footer>
    <p>&copy; 2026 | Joe Boat | WDD 131</p>
    <p id="lastModified"></p>
</footer>

</body>
</html>
```
