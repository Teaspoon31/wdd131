<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <meta
        name="description"
        content="Explore Ghana, its culture, landmarks, and weather information.">

    <meta
        name="author"
        content="Your Name">

    <title>Discover Ghana</title>

    <link rel="stylesheet" href="styles/place.css">

    <script src="scripts/place.js" defer></script>
</head>

<body>

    <header>
        <h1>Discover Ghana</h1>
    </header>

    <main>

        <!-- HERO IMAGE -->
        <section class="hero">

            <picture>

                <source
                    media="(min-width: 768px)"
                    srcset="images/place1.webp">

                <source
                    media="(max-width: 767px)"
                    srcset="images/ghanabeach.webp">

                <img
                    src="images/ghana.webp"
                    alt="Beautiful view of Ghana">

            </picture>

        </section>

        <!-- CONTENT -->
        <div class="content">

            <!-- DATA CARD -->
            <section class="card">

                <h2>Data</h2>

                <p><strong>Country:</strong> Ghana</p>
                <p><strong>Capital:</strong> Accra</p>
                <p><strong>Population:</strong> 33 Million</p>
                <p><strong>Languages:</strong> English</p>
                <p><strong>Currency:</strong> Ghana Cedi</p>
                <p><strong>Time Zone:</strong> GMT</p>

            </section>

            <!-- WEATHER CARD -->
            <section class="card weather">

                <h2>Weather</h2>

                <!-- SVG WEATHER ICON -->
                <img
                    src="images/weather001.webp"
                    alt="Weather icon"
                    class="weather-icon">

                <p>
                    <strong>Temperature:</strong>
                    <span id="temperature">28</span>°C
                </p>

                <p>
                    <strong>Wind Speed:</strong>
                    <span id="windspeed">12</span> km/h
                </p>

                <p>
                    <strong>Wind Chill:</strong>
                    <span id="windchill"></span>
                </p>

            </section>

        </div>

    </main>

    <footer>

        <p>
            &copy;
            <span id="year"></span>
            | Discover Ghana
        </p>

        <p id="lastModified"></p>

    </footer>

</body>
</html>
