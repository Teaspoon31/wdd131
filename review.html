<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Your product review has been successfully submitted. Thank you for sharing your experience." />
  <title>Review Submitted | ReviewHub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-inner">
      <a href="#" class="logo" aria-label="ReviewHub Home">
        <span class="logo-mark">R</span>
        <span class="logo-text">ReviewHub</span>
      </a>
    </div>
  </header>

  <main>
    <section class="confirmation-section">
      <div class="confirmation-card">
        <div class="confirm-icon" aria-hidden="true">✓</div>
        <h1 class="confirm-title">Review Submitted!</h1>
        <p class="confirm-message">Thank you for taking the time to share your feedback. Your review helps others make better decisions.</p>

        <div class="review-counter-card">
          <p class="counter-label">Total Reviews Submitted</p>
          <p class="counter-value" id="reviewCount" aria-live="polite">—</p>
          <p class="counter-sub">on this device</p>
        </div>

        <div class="confirm-actions">
          <a href="form.html" class="btn-primary">Write Another Review</a>
          <a href="#" class="btn-secondary">Back to Home</a>
        </div>
      </div>

      <div class="confirm-deco" aria-hidden="true">
        <span class="deco-star big">★</span>
        <span class="deco-star med">★</span>
        <span class="deco-star sm">★</span>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <p>&copy; 2025 ReviewHub. Built for W05 Assignment.</p>
      <nav class="footer-nav" aria-label="Footer navigation">
        <a href="#">Privacy</a>
        <a href="#">Terms</a>
        <a href="#">Contact</a>
      </nav>
    </div>
  </footer>

  <script src="js/review.js"></script>
</body>
</html>
