<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Filtered Temple Album</title>

    <meta name="description" content="A dynamic temple gallery with filtering using JavaScript." />
    <meta name="author" content="Joseph Amofa Boateng" />

    <link rel="stylesheet" href="styles/temples.css">
    <link rel="stylesheet" href="styles/temples-large.css">

    <script src="scripts/temples.js" defer></script>
</head>

<body>

<header>
    <h1>Temple Album</h1>

    <nav>
        <a href="#" data-filter="home">Home</a>
        <a href="#" data-filter="old">Old</a>
        <a href="#" data-filter="new">New</a>
        <a href="#" data-filter="large">Large</a>
        <a href="#" data-filter="small">Small</a>
    </nav>
</header>

<main>
    <h2>Temples Around the World</h2>

    <div id="templeContainer" class="gallery"></div>
</main>

<footer>
    <p>&copy; <span id="year"></span> | Joseph Amofa Boateng | Ghana</p>
    <p id="lastModified"></p>
</footer>

</body>
</html>
