<main>

<section class="panel">
  <h2>Add Item</h2>

  <form id="orderForm">

      <option>Produce</option>
      <option>Bakery</option>
      <option>Meat</option>
      <option>Dairy</option>

    <button type="submit">Add</button>

</section>
