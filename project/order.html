<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Place a curbside pickup order with FreshCart Local - add items and review your order.">
<title>Order Pickup - FreshCart Local</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <h1>Curbside Order</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="flyer.html">Deals</a>
    <a href="order.html">Order</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>

<section class="panel">
  <h2>Add Item</h2>

  <form id="orderForm">
    <label for="itemName">Item name</label>
    <input type="text" id="itemName" name="itemName" placeholder="Item name" required>

    <label for="itemCategory">Category</label>
    <select id="itemCategory" name="itemCategory">
      <option>Produce</option>
      <option>Bakery</option>
      <option>Meat</option>
      <option>Dairy</option>
    </select>

    <button type="submit">Add</button>
  </form>
</section>

<section class="panel">
  <h2>Your Order</h2>
  <ul id="orderList"></ul>
</section>

</main>

<footer>
  <p>&copy; 2026 FreshCart Local</p>
  <a href="references.html">References</a>
</footer>

<script src="script.js"></script>
</body>
</html>
