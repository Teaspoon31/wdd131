<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Contact FreshCart Local for questions about orders, weekly deals, or curbside pickup.">
<title>Contact - FreshCart Local</title>
<link rel="stylesheet" href="styles.css">
</head>

<body>

<header>
  <h1>Contact Us</h1>
  <nav>
    <a href="index.html">Home</a>
    <a href="flyer.html">Weekly Deals</a>
    <a href="order.html">Order</a>
    <a href="contact.html">Contact</a>
  </nav>
</header>

<main>

<section class="panel">
  <form id="contactForm">
    <label for="contactName">Name</label>
    <input type="text" id="contactName" name="name" placeholder="Name" required>

    <label for="contactEmail">Email</label>
    <input type="email" id="contactEmail" name="email" placeholder="Email" required>

    <label for="contactMsg">Message</label>
    <textarea id="contactMsg" name="message" placeholder="Message" required></textarea>

    <button type="submit">Send</button>
  </form>

  <p id="contactMessage"></p>
</section>

</main>

<footer>
  <p>&copy; 2026 FreshCart Local</p>
  <a href="references.html">References</a>
</footer>

<script src="script.js"></script>
</body>
</html>
